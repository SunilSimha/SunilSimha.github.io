- title: Research Experience
  type: time_table
  contents:
    - year: 2021 – Present
      title: The FLIMFLAM Survey
      department: "Advisors: J. Xavier Prochaska (UCSC), Khee-Gan Lee (IPMU)"
      maindescription: "FLIMFLAM is a redshift survey of foreground galaxies along Fast Radio Burst (FRB) sightlines to constrain key parameters describing the distribution of ionized matter in the CGM and IGM to ~20% precision."
      description:
        - "Leading spectroscopic observational efforts with the Keck and Gemini telescopes for redshift estimation"
        - "Involved in imaging and spectroscopic observation, data reduction, redshift and mass estimation"
        - "Matter density map reconstruction and Bayesian inference of parameters describing matter distribution in the universe"
    - year: 2018 – Present
      title: Optical Follow-up of Localized FRBs
      department: "Advisor: J. Xavier Prochaska"
      maindescription: "Current member of the F⁴ team. Involved in planning, execution and data reduction of observations of localized FRBs."
      description:
        - "Work with CRAFT, MeerTRAP, REALFAST, and DSA collaborations"
        - "Use optical telescopes: Keck, Gemini, SOAR"
        - "FRB host galaxy identification and characterization"
        - "Study foreground matter along FRB sightlines"
    - year: May – July 2022
      title: Keck Visiting Scholar
      department: "Advisors: Percy Gomez (Keck), Sherry Yeh (Keck)"
      maindescription: "Characterized the gratings and detector subsystems of the Low-Resolution Imaging Spectrograph (LRIS) on the Keck telescope."
      description:
        - "Produced spectroscopic throughput measurements for three gratings"
        - "Automated the monthly checkout procedure for LRIS"
    - year: 2020 – 2021
      title: LRIS Red-side Detector Upgrade
      department: "Advisor: Constance Rockosi (UCSC)"
      maindescription: "Involved in testing and commissioning of the optical CCD upgrade to LRIS on the Keck telescope."
      description:
        - "Characterized CCD response through measurements of readout noise, gain and linearity"
    - year: 2017 – 2018
      title: "Mg II Absorber Clustering"
      department: "Advisors: Raghunathan Srianand (IUCAA), L. Sriram Kumar (IITM)"
      maindescription: "Studied the clustering and distribution of metal absorption lines, specifically the Mg II doublet in quasar spectra."
      description:
        - "Investigated masses of foreground halos contributing to absorption features"

