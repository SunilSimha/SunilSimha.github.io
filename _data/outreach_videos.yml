- title: "Uncovering the hidden universe"
  blurb: >-
    An eight-minute talk for a general audience, recorded at Northwestern University: how background
    light sources such as fast radio bursts help us reveal invisible gas in space. This was my final
    presentation for the excellent
    <a href="https://www.tgs.northwestern.edu/services-support/professional-development/rctp/">RCTP course</a>.
  webm: /assets/video/outreach/rctp_1080p.webm
  mp4: /assets/video/outreach/rctp_720p.mp4
  poster: /assets/img/outreach/rctp_poster.jpg

